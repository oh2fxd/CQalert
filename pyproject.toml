[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cqalert"
version = "0.1.0"
description = "Lightweight GNOME/X11 FT8 overlay for WSJT-X that shows fresh unworked CQ stations as desktop tiles and can arm WSJT-X over UDP."
readme = "README.md"
authors = [
    { name = "Mikko Lähteenmäki", email = "oh2fxd@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt",
    "Pillow",
    "pycountry",
    "cairosvg",
]
keywords = ["hamradio", "ft8", "wsjtx", "amateur-radio", "overlay", "dxcc", "gnome", "x11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]

[project.scripts]
cqalert = "cqalert.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["cqalert*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
